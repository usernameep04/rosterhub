<style>
  .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--text-muted); font-size:14px; margin-bottom:24px; }
  .back-link:hover { color: var(--text); }
  .detail-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:28px; }
  .detail-name { font-size: clamp(28px, 4vw, 40px); }
  .detail-tags { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .detail-tags a { font-family: var(--font-mono); font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--border); color:var(--text-muted); transition: color .15s, border-color .15s; }
  .detail-tags a:hover { color: var(--accent-b); border-color: var(--accent-b); }
  .socials { display:flex; gap:10px; margin-top:14px; }
  .socials a { font-family: var(--font-mono); font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); color:var(--accent-b); }
  .socials a:hover { border-color: var(--accent-b); }
  .rating-block { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .rating-big { display:flex; align-items:center; gap:10px; }
  .rating-num { font-family: var(--font-display); font-size:28px; }
  .rate-prompt { font-size:12px; color: var(--text-muted); }
  .rate-stars { display:inline-flex; gap:4px; cursor:pointer; }
  .rate-stars svg { width:22px; height:22px; transition: transform .1s; }
  .rate-stars svg:hover { transform: scale(1.15); }
  .rate-stars.rated svg { cursor: default; }
  .rate-stars.rated svg:hover { transform: none; }
  .rated-msg { font-size: 12px; color: var(--success); }
  .gallery { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap:14px; margin-bottom:20px; }
  .gallery-item { border-radius: var(--radius-md); overflow:hidden; aspect-ratio:3/4; background:var(--surface); border:1px solid var(--border); }
  .gallery-item img, .gallery-item video { width:100%; height:100%; object-fit:cover; }
  .add-more-tile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--text-muted); font-size:12px; text-align:center; cursor:pointer; border:1.5px dashed var(--border); }
  .add-more-tile:hover { border-color: var(--accent-b); color: var(--text); }
  .add-more-tile svg { width:22px; height:22px; stroke: currentColor; }
  .plus-icon { font-size: 26px; line-height:1; }
  .gallery-item.viewable { cursor: zoom-in; }

  .fab-add {
    position: fixed;
    right: 24px;
    bottom: 28px;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px 14px 16px;
    border-radius: 999px;
    border: none;
    background: var(--accent-gradient);
    color: #0B0E1A;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 10px 30px rgba(124,92,252,0.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .fab-add:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(124,92,252,0.45); }
  .fab-add svg { width: 20px; height: 20px; }
  @media (max-width: 640px) {
    .fab-add { right: 16px; bottom: 16px; padding: 13px 16px 13px 14px; }
    .fab-add span.fab-label { display: none; }
  }

  /* Lightbox */
  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(6,8,15,0.94);
    display: none;
    align-items: center; justify-content: center;
  }
  .lightbox-overlay.show { display: flex; }
  .lightbox-stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 70px 90px;
  }
  .lightbox-frame {
    height: min(82vh, 760px);
    aspect-ratio: 3 / 4;
    max-width: 92vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .lightbox-frame img, .lightbox-frame video {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .lightbox-close, .lightbox-prev, .lightbox-next {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: border-color .15s, transform .15s;
  }
  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover {
    border-color: var(--accent-b);
  }
  .lightbox-close { top: 18px; right: 18px; }
  .lightbox-prev { left: 18px; top: 50%; transform: translateY(-50%); }
  .lightbox-next { right: 18px; top: 50%; transform: translateY(-50%); }
  .lightbox-prev:hover, .lightbox-next:hover { transform: translateY(-50%) scale(1.08); }
  .lightbox-counter {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 999px;
  }
  @media (max-width: 640px) {
    .lightbox-stage { padding: 70px 16px; }
    .lightbox-prev { left: 6px; } .lightbox-next { right: 6px; }
  }
</style>
